<app-page-header title="Recursos" subtitle="Catálogo de operaciones (método + ruta) que se pueden conceder a un rol.">
  @for (c of countsByMethod(); track c.method) {
    <p-tag [value]="c.method + ' ' + c.count" [severity]="methodSeverity(c.method)" [rounded]="true" />
  }
  <button pButton type="button" *appHasPermission="'POST /api/recursos'" (click)="openCreate()">
    <i pButtonIcon class="pi pi-plus"></i><span pButtonLabel>Nuevo recurso</span>
  </button>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">{{ error() }}</p-message>
}

<div class="rounded-xl border border-slate-200 bg-white">
  <p-table [value]="visibleRows()" [loading]="loading()" [paginator]="visibleRows().length > 15" [rows]="15" dataKey="id" tableStyleClass="min-w-3xl">
    <ng-template #caption>
      <div class="grid gap-2 sm:grid-cols-4">
        <div class="flex items-center gap-2 sm:col-span-3">
          <i class="pi pi-search text-slate-400"></i>
          <input pInputText type="search" aria-label="Buscar recursos" placeholder="Buscar por ruta o descripción…"
            [value]="filter()" (input)="filter.set($any($event.target).value)" class="w-full" />
        </div>
        <p-select [options]="methods" optionLabel="label" optionValue="value" [ngModel]="methodFilter()"
          (ngModelChange)="methodFilter.set($event)" [showClear]="true" placeholder="Todos los métodos"
          ariaLabel="Filtrar por método" [fluid]="true" />
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th class="w-24">Método</th>
        <th pSortableColumn="path"><div class="flex items-center gap-1">Ruta <p-sort-icon field="path" /></div></th>
        <th>Descripción</th>
        <th>Estado</th>
        <th class="w-40 text-right">Acciones</th>
      </tr>
    </ng-template>
    <ng-template #body let-resource>
      <tr>
        <td><p-tag [value]="resource.method" [severity]="methodSeverity(resource.method)" /></td>
        <td class="font-mono text-xs text-slate-700">{{ resource.path }}</td>
        <td class="text-sm text-slate-600">{{ resource.description || '—' }}</td>
        <td><app-status-tag [active]="resource.status === 'active'" /></td>
        <td>
          <div class="flex justify-end gap-1">
            <button pButton type="button" text rounded severity="secondary" icon="pi pi-pencil"
              *appHasPermission="'PATCH /api/recursos/:id'" aria-label="Editar recurso" pTooltip="Editar" (click)="openEdit(resource)"></button>
            <button pButton type="button" text rounded severity="warn" icon="pi pi-ban"
              *appHasPermission="'PATCH /api/recursos/:id/deactivate'" aria-label="Desactivar recurso" pTooltip="Baja lógica" (click)="deactivate(resource)"></button>
            <button pButton type="button" text rounded severity="danger" icon="pi pi-trash"
              *appHasPermission="'DELETE /api/recursos/:id'" aria-label="Eliminar recurso" pTooltip="Eliminar" (click)="remove(resource)"></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr><td colspan="5"><app-empty-state icon="pi pi-sitemap" title="Sin recursos" message="Ningún recurso coincide con el filtro." /></td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [visible]="dialogVisible()" (visibleChange)="dialogVisible.set($event)" [header]="title()"
  [modal]="true" [draggable]="false" [resizable]="false" [dismissableMask]="true" styleClass="w-full max-w-2xl mx-4">
  <app-resource-form [resource]="editing()" [saving]="saving()" [resetKey]="resetKey()" (saved)="save($event)" (cancelled)="dialogVisible.set(false)" />
</p-dialog>
