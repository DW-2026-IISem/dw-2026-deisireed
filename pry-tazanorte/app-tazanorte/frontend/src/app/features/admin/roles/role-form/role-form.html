<form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
  <div class="grid gap-4 sm:grid-cols-3">
    <div class="sm:col-span-2">
      <label for="role-name" class="mb-1 block text-sm font-medium text-slate-700">
        Nombre <span class="text-red-500">*</span>
      </label>
      <input
        id="role-name"
        pInputText
        formControlName="name"
        placeholder="MESERO"
        class="w-full uppercase"
      />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <p-message severity="error" size="small" variant="simple" styleClass="mt-1"
          >El nombre es obligatorio.</p-message
        >
      }
    </div>
    @if (!role()) {
      <div>
        <label for="role-status" class="mb-1 block text-sm font-medium text-slate-700"
          >Estado</label
        >
        <p-select
          inputId="role-status"
          formControlName="status"
          [options]="statusOptions"
          optionLabel="label"
          optionValue="value"
          [fluid]="true"
        />
      </div>
    }
  </div>

  <div>
    <label for="role-desc" class="mb-1 block text-sm font-medium text-slate-700">Descripción</label>
    <textarea
      id="role-desc"
      pTextarea
      formControlName="description"
      rows="3"
      class="w-full"
      placeholder="Qué hace este rol en la cafetería"
    ></textarea>
  </div>

  <p class="text-xs text-slate-500">
    El nombre se guarda en MAYÚSCULAS. Un rol no autoriza nada hasta que le concedes permisos.
  </p>

  <div class="flex justify-end gap-2 border-t border-slate-100 pt-4">
    <button pButton type="button" severity="secondary" outlined (click)="cancelled.emit()">
      <span pButtonLabel>Cancelar</span>
    </button>
    <button pButton type="submit" [loading]="saving()">
      <i pButtonIcon class="pi pi-check"></i><span pButtonLabel>Guardar</span>
    </button>
  </div>
</form>
