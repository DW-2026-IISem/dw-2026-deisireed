<div class="mx-auto flex max-w-lg flex-col items-center gap-4 py-16 text-center">
  <span class="flex h-16 w-16 items-center justify-center rounded-full bg-red-50">
    <i class="pi pi-lock text-2xl text-red-500"></i>
  </span>
  <h1 class="text-2xl font-semibold text-slate-900">Acceso denegado (403)</h1>
  <p class="text-sm text-slate-500">
    Tu rol <strong>{{ session.roleLabel() }}</strong> no tiene permiso para abrir esta pantalla.
  </p>

  @if (permission) {
    <div class="w-full rounded-xl bg-black/40 px-4 py-3 text-left">
      <p class="text-[11px] uppercase tracking-wider text-slate-400">Permiso requerido</p>
      <code class="text-sm text-emerald-300">{{ permission }}</code>
    </div>
    <p class="text-xs text-slate-400">
      Un administrador puede concederlo en Seguridad → Permisos por rol.
    </p>
  }

  <a pButton routerLink="/">
    <i pButtonIcon class="pi pi-home"></i>
    <span pButtonLabel>Ir a mi inicio</span>
  </a>
</div>
