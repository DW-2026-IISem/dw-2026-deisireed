<app-page-header title="Insumos" subtitle="Catálogo de insumos de bodega.">
  <p-tag [value]="rows().length + ' activos'" severity="info" [rounded]="true" />
  <button pButton type="button" *appHasPermission="'POST /api/insumos'" (click)="openCreate()">
    <i pButtonIcon class="pi pi-plus"></i><span pButtonLabel>Nuevo insumo</span>
  </button>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">{{ error() }}</p-message>
}

<div class="rounded-xl border border-slate-200 bg-white">
  <p-table [value]="visibleRows()" [loading]="loading()" [paginator]="visibleRows().length > 10" [rows]="10" dataKey="id" tableStyleClass="min-w-3xl">
    <ng-template #caption>
      <div class="flex items-center gap-2">
        <i class="pi pi-search text-slate-400"></i>
        <input pInputText type="search" aria-label="Buscar insumos" placeholder="Buscar por código, insumo o unidad…"
          [value]="filter()" (input)="filter.set($any($event.target).value)" class="w-full" />
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th pSortableColumn="codigo"><div class="flex items-center gap-1">Código <p-sort-icon field="codigo" /></div></th>
        <th pSortableColumn="nombre"><div class="flex items-center gap-1">Insumo <p-sort-icon field="nombre" /></div></th>
        <th>Unidad</th>
        <th class="text-right">Stock mín.</th>
        <th>Estado</th>
        <th class="w-40 text-right">Acciones</th>
      </tr>
    </ng-template>
    <ng-template #body let-supply>
      <tr>
        <td class="font-mono text-sm text-slate-600">{{ supply.codigo }}</td>
        <td class="font-medium text-slate-800">{{ supply.nombre }}</td>
        <td class="text-sm text-slate-600">{{ supply.unidad_medida }}</td>
        <td class="text-right">{{ toNumber(supply.stock_minimo) | number: '1.0-2' }}</td>
        <td><app-status-tag [active]="supply.is_active" /></td>
        <td>
          <div class="flex justify-end gap-1">
            <button pButton type="button" text rounded severity="secondary" icon="pi pi-pencil"
              *appHasPermission="'PATCH /api/insumos/:id'" aria-label="Editar insumo" pTooltip="Editar" (click)="openEdit(supply)"></button>
            <button pButton type="button" text rounded severity="warn" icon="pi pi-ban"
              *appHasPermission="'PATCH /api/insumos/:id/deactivate'" aria-label="Desactivar insumo" pTooltip="Baja lógica" (click)="deactivate(supply)"></button>
            <button pButton type="button" text rounded severity="danger" icon="pi pi-trash"
              *appHasPermission="'DELETE /api/insumos/:id'" aria-label="Eliminar insumo" pTooltip="Eliminar" (click)="remove(supply)"></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr><td colspan="6"><app-empty-state icon="pi pi-inbox" title="Sin insumos" message="Crea el primero con «Nuevo insumo»." /></td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [visible]="dialogVisible()" (visibleChange)="dialogVisible.set($event)" [header]="title()"
  [modal]="true" [draggable]="false" [resizable]="false" [dismissableMask]="true" styleClass="w-full max-w-xl mx-4">
  <app-supply-form [supply]="editing()" [saving]="saving()" [resetKey]="resetKey()" (saved)="save($event)" (cancelled)="dialogVisible.set(false)" />
</p-dialog>
