<div class="tn-aside flex h-full flex-col overflow-hidden rounded-3xl bg-[#3b2416] text-[#f3e6d8] shadow-2xl shadow-[#3b2416]/30">
  <div class="flex items-center gap-3 px-5 pb-4 pt-6">
    <span class="flex h-11 w-11 items-center justify-center rounded-2xl bg-[#f6ede3]/10">
      <img src="/brand/tazanorte-mark.svg" alt="Logo de TazaNorte" class="h-8 w-8 rounded-lg" />
    </span>
    <div class="min-w-0">
      <p class="tn-serif truncate text-xl font-bold text-[#f6ede3]">{{ appName() }}</p>
      <p class="text-[10px] uppercase tracking-[0.2em] text-[#d9b89a]">Café de especialidad</p>
    </div>
  </div>

  <div class="flex-1 overflow-y-auto px-3 pb-3">
    <nav aria-label="Navegación principal" (click)="onNavigationClick($event)">
      <p-panelmenu [model]="items()" [multiple]="true" />
    </nav>
  </div>

  @if (showSession()) {
    <div class="m-3 rounded-2xl bg-[#f6ede3]/10 p-4">
      <p class="text-sm font-semibold text-[#f6ede3]">{{ username() || 'Invitado' }}</p>
      <p class="text-xs text-[#d9b89a]">{{ roleLabel() }}</p>
      <div class="mt-3 flex items-center justify-between text-xs text-[#d9b89a]">
        <span>{{ permissionCount() }} permisos</span>
        <button pButton type="button" text rounded aria-label="Cerrar sesión" (click)="logoutRequested.emit()">
          <i pButtonIcon class="pi pi-sign-out text-[#f6ede3]"></i>
        </button>
      </div>
    </div>
  }
</div>
